name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name (e.g. v0.1.1)'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact: ah-linux-x86_64
          # Native arm64 runner: no cross toolchain needed for bundled SQLite.
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            artifact: ah-linux-arm64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: ah-darwin-arm64
          # Apple's toolchain on the arm64 runner builds x86_64 natively.
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: ah-darwin-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install musl-tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: cp target/${{ matrix.target }}/release/ah ${{ matrix.artifact }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - run: chmod +x ah-*/ah-*
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ah-linux-x86_64/ah-linux-x86_64
            ah-linux-arm64/ah-linux-arm64
            ah-darwin-arm64/ah-darwin-arm64
            ah-darwin-x86_64/ah-darwin-x86_64

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  homebrew:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Generate formula and push to tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${TAG#v}"
          BASE_URL="https://github.com/nihen/ah/releases/download/${TAG}"
          for a in darwin-arm64 darwin-x86_64 linux-arm64 linux-x86_64; do
            curl -fsSL --retry 3 "${BASE_URL}/ah-${a}" -o "ah-${a}"
          done
          SHA_DARWIN_ARM64=$(sha256sum ah-darwin-arm64 | cut -d' ' -f1)
          SHA_DARWIN_X86_64=$(sha256sum ah-darwin-x86_64 | cut -d' ' -f1)
          SHA_LINUX_ARM64=$(sha256sum ah-linux-arm64 | cut -d' ' -f1)
          SHA_LINUX_X86_64=$(sha256sum ah-linux-x86_64 | cut -d' ' -f1)

          export VERSION BASE_URL SHA_DARWIN_ARM64 SHA_DARWIN_X86_64 SHA_LINUX_ARM64 SHA_LINUX_X86_64
          # shellcheck disable=SC2016 # envsubst takes the variable list literally
          envsubst '${VERSION} ${BASE_URL} ${SHA_DARWIN_ARM64} ${SHA_DARWIN_X86_64} ${SHA_LINUX_ARM64} ${SHA_LINUX_X86_64}' \
            < .github/formula.rb.tmpl > ah.rb
          # A template from an older tag (manual dispatch) may use other
          # placeholders; refuse to publish a formula with any left over.
          # shellcheck disable=SC2016 # literal "${" is the search pattern
          if grep -nF '${' ah.rb; then
            echo "::error::formula template has unexpanded placeholders"
            exit 1
          fi

          git clone "https://x-access-token:${GH_TOKEN}@github.com/nihen/homebrew-tap.git"
          mkdir -p homebrew-tap/Formula
          cp ah.rb homebrew-tap/Formula/ah.rb
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/ah.rb
          git commit -m "ah ${VERSION}"
          git push
