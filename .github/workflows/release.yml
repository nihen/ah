name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name (e.g. v0.1.1)'
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # Publish only a vX.Y.Z tag that is on main and names the crate version.
  # A manual run (auto-tag dispatches one, as its tag push starts no
  # workflow) must run from that same tag.
  verify:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: check
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "not a vX.Y.Z tag: $TAG"
          [ "$GITHUB_REF" = "refs/tags/$TAG" ] || fail "run from $GITHUB_REF, not refs/tags/$TAG"
          SHA=$(git rev-parse --verify "refs/tags/$TAG^{commit}") || fail "no tag $TAG"
          git merge-base --is-ancestor "$SHA" origin/main || fail "$TAG is not on main"
          VERSION=$(git show "$SHA:Cargo.toml" | grep -m1 '^version' | sed 's/.*"\(.*\)"/\1/')
          [ "v$VERSION" = "$TAG" ] || fail "Cargo.toml version $VERSION does not match $TAG"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  build:
    needs: verify
    # Each binary gets a signed build provenance attestation; check one with
    # `gh attestation verify <file> --repo nihen/ah`.
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact: ah-linux-x86_64
          # Native arm64 runner: no cross toolchain needed for bundled SQLite.
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            artifact: ah-linux-arm64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: ah-darwin-arm64
          # Apple's toolchain on the arm64 runner builds x86_64 natively.
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: ah-darwin-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      # No build cache: a cache written by other runs must not reach a
      # published binary.
      - name: Install musl-tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: cp target/${{ matrix.target }}/release/ah ${{ matrix.artifact }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ matrix.artifact }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  # Publishing jobs run in the `release` environment, where GitHub can
  # require an approval and restrict deployments to v* tags.
  release:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      - run: chmod +x ah-*/ah-*
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(ah-linux-x86_64/ah-linux-x86_64 ah-linux-arm64/ah-linux-arm64
                 ah-darwin-arm64/ah-darwin-arm64 ah-darwin-x86_64/ah-darwin-x86_64)
          # A re-run replaces the files of the release it already made.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --generate-notes "${files[@]}"
          fi

  # crates.io trusted publishing: a short-lived token for this workflow and
  # environment, revoked when the job ends; no stored registry token.
  publish:
    needs: [verify, build]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: stable
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  homebrew:
    needs: [verify, release]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      # The formula's digests come from the published binaries, and only
      # after their attestations show this workflow built them from the tag.
      - name: Download and verify the release binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE_URL="https://github.com/nihen/ah/releases/download/${TAG}"
          for a in darwin-arm64 darwin-x86_64 linux-arm64 linux-x86_64; do
            curl -fsSL --retry 3 "${BASE_URL}/ah-${a}" -o "ah-${a}"
            gh attestation verify "ah-${a}" --repo nihen/ah \
              --signer-workflow nihen/ah/.github/workflows/release.yml \
              --source-ref "refs/tags/${TAG}"
          done
      - name: Generate formula and push to tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${TAG#v}"
          BASE_URL="https://github.com/nihen/ah/releases/download/${TAG}"
          SHA_DARWIN_ARM64=$(sha256sum ah-darwin-arm64 | cut -d' ' -f1)
          SHA_DARWIN_X86_64=$(sha256sum ah-darwin-x86_64 | cut -d' ' -f1)
          SHA_LINUX_ARM64=$(sha256sum ah-linux-arm64 | cut -d' ' -f1)
          SHA_LINUX_X86_64=$(sha256sum ah-linux-x86_64 | cut -d' ' -f1)

          export VERSION BASE_URL SHA_DARWIN_ARM64 SHA_DARWIN_X86_64 SHA_LINUX_ARM64 SHA_LINUX_X86_64
          # shellcheck disable=SC2016 # envsubst takes the variable list literally
          envsubst '${VERSION} ${BASE_URL} ${SHA_DARWIN_ARM64} ${SHA_DARWIN_X86_64} ${SHA_LINUX_ARM64} ${SHA_LINUX_X86_64}' \
            < .github/formula.rb.tmpl > ah.rb
          # A template from an older tag (manual dispatch) may use other
          # placeholders; refuse to publish a formula with any left over.
          # shellcheck disable=SC2016 # literal "${" is the search pattern
          if grep -nF '${' ah.rb; then
            echo "::error::formula template has unexpanded placeholders"
            exit 1
          fi

          git clone "https://x-access-token:${GH_TOKEN}@github.com/nihen/homebrew-tap.git"
          mkdir -p homebrew-tap/Formula
          cp ah.rb homebrew-tap/Formula/ah.rb
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/ah.rb
          git commit -m "ah ${VERSION}"
          git push
