name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name (e.g. v0.1.1)'
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # Publish only a vX.Y.Z tag that is on main and names the crate version.
  # A manual run (auto-tag dispatches one, as its tag push starts no
  # workflow) must run from that same tag.
  verify:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: check
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "not a vX.Y.Z tag: $TAG"
          [ "$GITHUB_REF" = "refs/tags/$TAG" ] || fail "run from $GITHUB_REF, not refs/tags/$TAG"
          SHA=$(git rev-parse --verify "refs/tags/$TAG^{commit}") || fail "no tag $TAG"
          git merge-base --is-ancestor "$SHA" origin/main || fail "$TAG is not on main"
          VERSION=$(git show "$SHA:Cargo.toml" | grep -m1 '^version' | sed 's/.*"\(.*\)"/\1/')
          [ "v$VERSION" = "$TAG" ] || fail "Cargo.toml version $VERSION does not match $TAG"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  build:
    needs: verify
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact: ah-linux-x86_64
          # Native arm64 runner: no cross toolchain needed for bundled SQLite.
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            artifact: ah-linux-arm64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: ah-darwin-arm64
          # Apple's toolchain on the arm64 runner builds x86_64 natively.
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: ah-darwin-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install musl-tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: cp target/${{ matrix.target }}/release/ah ${{ matrix.artifact }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      - run: chmod +x ah-*/ah-*
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ env.TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ah-linux-x86_64/ah-linux-x86_64
            ah-linux-arm64/ah-linux-arm64
            ah-darwin-arm64/ah-darwin-arm64
            ah-darwin-x86_64/ah-darwin-x86_64

  publish:
    needs: [verify, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: stable
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  homebrew:
    needs: [verify, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - name: Generate formula and push to tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${TAG#v}"
          BASE_URL="https://github.com/nihen/ah/releases/download/${TAG}"
          for a in darwin-arm64 darwin-x86_64 linux-arm64 linux-x86_64; do
            curl -fsSL --retry 3 "${BASE_URL}/ah-${a}" -o "ah-${a}"
          done
          SHA_DARWIN_ARM64=$(sha256sum ah-darwin-arm64 | cut -d' ' -f1)
          SHA_DARWIN_X86_64=$(sha256sum ah-darwin-x86_64 | cut -d' ' -f1)
          SHA_LINUX_ARM64=$(sha256sum ah-linux-arm64 | cut -d' ' -f1)
          SHA_LINUX_X86_64=$(sha256sum ah-linux-x86_64 | cut -d' ' -f1)

          export VERSION BASE_URL SHA_DARWIN_ARM64 SHA_DARWIN_X86_64 SHA_LINUX_ARM64 SHA_LINUX_X86_64
          # shellcheck disable=SC2016 # envsubst takes the variable list literally
          envsubst '${VERSION} ${BASE_URL} ${SHA_DARWIN_ARM64} ${SHA_DARWIN_X86_64} ${SHA_LINUX_ARM64} ${SHA_LINUX_X86_64}' \
            < .github/formula.rb.tmpl > ah.rb
          # A template from an older tag (manual dispatch) may use other
          # placeholders; refuse to publish a formula with any left over.
          # shellcheck disable=SC2016 # literal "${" is the search pattern
          if grep -nF '${' ah.rb; then
            echo "::error::formula template has unexpanded placeholders"
            exit 1
          fi

          git clone "https://x-access-token:${GH_TOKEN}@github.com/nihen/homebrew-tap.git"
          mkdir -p homebrew-tap/Formula
          cp ah.rb homebrew-tap/Formula/ah.rb
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/ah.rb
          git commit -m "ah ${VERSION}"
          git push
